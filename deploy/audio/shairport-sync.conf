// Shairport-sync configuration for Microduck robot
// Installed by scripts/setup-airplay.sh
//
// This configures the robot as an AirPlay receiver, outputting audio
// to the I2S MAX98357A DAC+amplifier.

general =
{
    // The name the device advertises via mDNS. The setup script replaces
    // this with the robot's actual name from /etc/hostname or configd.
    name = "Microduck Robot";

    // Use ALSA output backend
    output_backend = "alsa";

    // Stereo, 44.1 kHz, 16-bit — CD quality, what AirPlay sends
    ignore_volume_control = "no";

    // Disable statistics logging — noisy and not useful on a robot
    // (moved to diagnostics section in newer versions)
};

diagnostics =
{
    statistics = "no";
};

alsa =
{
    // The I2S audio card: MAX98357A (playback) + INMP441 (capture)
    // Device 1 is playback, device 0 is capture
    output_device = "softvol_boost";

    // Use the plug layer to handle format conversion — AirPlay sends
    // 44100/16/2, but the plug layer ensures compatibility even if
    // the hardware prefers something different.

    // MAX98357A has no hardware volume control, so we use software
    // volume in shairport-sync instead.
};

sessioncontrol =
{
    // Run these before/after a session starts/ends — useful for
    // enabling/disabling the amplifier or logging
    // session_start = "/usr/local/bin/airplay-start.sh";
    // session_end = "/usr/local/bin/airplay-end.sh";
};
